# hosts/control/systemInfo.toml
hostName = "theBullpen"
# ipAddr = "192.168.1.202/24"
networkInterfaceName = "enp2s0"
mainUser = "damajha"
tailscaleIp = "100.96.121.10"

[accounts]
# enroll users whose roles intersect these:
includeRoles = ["workstation"]
# optional per-host tweaks:
